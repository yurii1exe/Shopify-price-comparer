services:
  mongo:
    image: mongo:7
    container_name: price-comparer-mongo
    restart: unless-stopped
    ports:
      # Override with MONGO_PORT when 27017 is already taken on the host;
      # MONGODB_URI in .env has to agree with it.
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # The service refuses to buffer queries against a connection that is not up,
      # so it needs Mongo to be answering before it starts, not merely running.
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
